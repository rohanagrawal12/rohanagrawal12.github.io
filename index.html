const THEMES=[["auto","Device default","#8A8A90"],["light","Light","#F3F3F4"],["dark","Dark","#111113"],["forest","Forest","#1F4D36"],["yellow","Classic yellow","#F7D63E"],["marker","Marker","#000000"]];
function myView(){const R=results(),u=me(),sv=R.filter(r=>S.saved[r.o.id]),dn=R.filter(r=>S.mine[r.o.id]),seg=S.seg,X={friends:"Friends",inbox:"Messages",post:"Post"};
 const segs=[["saved","Saved",sv.length],["doing","I’m doing",dn.length],...(X[seg]?[[seg,X[seg]]]:[])];
 const body=seg==="saved"?(sv.length?cards(sv):emptyState("Nothing saved yet.","Save a club and it will show up here.","Browse clubs")):seg==="doing"?(dn.length?cards(dn):emptyState("Nothing here yet.","Tap Explore on a club, then “I’m already in this.”","Browse clubs")):!u?`<div class="es"><h2>Log in to continue</h2><p class="mut">Friends, messages and posting need an account.</p><button class="btn pri" data-act="login">Log in</button></div>`:seg==="friends"?friendsView():seg==="inbox"?inboxView():postView();
 return`<div class="eyebrow">YOUR SPACE</div><h1>My Activities</h1><div class="segs">${segs.map(([k,l,n])=>`<button class="${seg===k?"on":""}" data-act="seg" data-v="${k}">${l}${n!==undefined?" "+n:""}</button>`).join("")}</div>${body}${S.done&&(seg==="saved"||seg==="doing")?fromQuiz():""}`}
function settingsView(){const u=me();return`<h1>Settings</h1><section class="pnl"><h2>Appearance</h2><div class="opts">${THEMES.map(([v,l,c])=>`<button class="optc${S.theme===v?" on":""}" data-act="theme" data-v="${v}"><i class="sw" style="background:${c}"></i>${l}</button>`).join("")}</div></section>
<section class="pnl"><h2>More</h2><div class="row"><button class="btn" data-act="goseg" data-v="friends">Friends</button><button class="btn" data-act="goseg" data-v="inbox">Messages</button><button class="btn" data-act="welcome">Welcome screens</button>${u&&u.provider?`<button class="btn" data-act="goseg" data-v="post">Post an opportunity</button>`:""}</div></section>
<section class="pnl"><h2>Quiz &amp; data</h2><div class="row"><button class="btn" data-act="quiz">${S.done?"Retake the quiz":"Take the quiz"}</button><button class="btn" data-act="clear">Clear my saved data</button></div><p class="mut" style="margin-bottom:0">Everything is saved on this device only.</p></section>
<section class="pnl"><h2>Account</h2>${u?`<p><b>${esc(u.name)}</b><br><span class="mut">${esc(u.email)} · ${esc(u.role)}${u.provider?" · Provider"+(u.org?" ("+esc(u.org)+")":""):""}</span></p><div class="row"><button class="btn" data-act="logout">Log out</button><button class="btn" data-act="del">Delete my account</button></div>`:`<p class="mut">You’re using ${BRAND} as a guest.</p><div class="row"><button class="btn pri" data-act="login">Log in</button><button class="btn" data-act="signup">Create account</button></div>`}</section>`}
function render(){const app=S.stage==="app",u=me(),R=document.documentElement;if(app)S.seen=true;document.body.classList.toggle("full",!app);$("bnm").textContent=BRAND;document.title=TITLE;
 if(S.theme==="auto")R.removeAttribute("data-theme");else R.dataset.theme=S.theme;R.dataset.anim=S.anim;
 const nb=TABS.map(([t,i])=>`<button class="${t===S.tab?"on":""}" data-tab="${t}"><span class="ti">${IC[i]}</span><span>${t}</span></button>`).join("");$("nav").innerHTML=nb;$("bn").innerHTML=nb;
 $("full").innerHTML=app?"":stageView();const t=S.tab;
 $("main").innerHTML=!app?"":t==="Search"?searchView():t==="Settings"?settingsView():t==="My Activities"?myView():listView(["School","Community","Explore"].includes(t)?t:"School");save();hSync()}
/* ---------- events ---------- */
async function act(a,d){
 const F=x=>{Object.assign(S,x);render();scrollTo(0,0)};
 if(a==="quiz")F({stage:"quiz",step:0,err:""});else if(a==="notnow")F({stage:"app",tab:"School"});else if(a==="skip")F({stage:"app"});
 else if(a==="login")F({stage:"login",err:""});else if(a==="signup")F({stage:"signup",err:""});else if(a==="guest")F({stage:"prompt"});else if(a==="back2")goBack(()=>F({stage:S.seen?"app":"auth",err:""}));
 else if(a==="snext")S.slide<2?F({slide:S.slide+1}):F({stage:S.seen?"app":"auth"});else if(a==="sback")goBack(()=>F({slide:Math.max(0,S.slide-1)}));else if(a==="welcome")F({stage:"intro",slide:0});
 else if(a==="back")goBack(()=>F({step:Math.max(0,S.step-1),err:""}));
 else if(a==="next"){const m=valid();if(m){S.err=m;render();return}if(S.step<PAGES.length-1)F({step:S.step+1,err:""});else{S.done=true;if(me())me().ans=S.ans;F({stage:"loading"});runLoad()}}
 else if(a==="playvid")playVideo();
 else if(a==="explore"){S.open[d.id]=!S.open[d.id];render()}else if(a==="mine"){S.mine[d.id]=!S.mine[d.id];render()}else if(a==="save"){S.saved[d.id]=!S.saved[d.id];render()}
 else if(a==="theme"){S.theme=d.v;render()}else if(a==="cat"){S.cat=d.v;S.lim=8;render()}else if(a==="more"){S.lim+=MORE;render()}else if(a==="seg"){S.seg=d.v;S.compose=null;render()}else if(a==="myact")go("My Activities",{seg:"doing"});else if(a==="goseg")go("My Activities",{seg:d.v,compose:null});
 else if(a==="clear"){try{["bl.state","bl.users","bl.msgs","bl.custom"].forEach(k=>localStorage.removeItem(k))}catch(x){}try{sessionStorage.removeItem("bl.visit");history.replaceState(null,"")}catch(x){}location.reload()}
 else if(a==="dosignup"){const e=val("a_email").trim().toLowerCase(),n=val("a_name").trim(),pw=val("a_pw"),prov=(document.querySelector('input[name="a_prov"]:checked')||{}).value==="yes";
  if(!n||!/.+@.+\..+/.test(e)||pw.length<6){S.err="Enter your name, a valid email and a password of 6+ characters.";render();return}if(users[e]){S.err="That email already has an account.";render();return}
  users[e]={name:n,email:e,pw:await sha(pw),role:val("a_role"),provider:prov,org:val("a_org").trim(),friends:[]};F({me:e,stage:S.seen?"app":"prompt",tab:"School"})}
 else if(a==="dologin"){const e=val("a_email").trim().toLowerCase(),u=users[e];if(!u||u.pw!==await sha(val("a_pw"))){S.err="Email or password is incorrect.";render();return}S.me=e;if(u.ans){S.ans=u.ans;S.done=true}F({stage:"app",tab:"School"})}
 else if(a==="logout")F({me:null,tab:"School"});else if(a==="del"){if(confirm("Delete your account on this device?")){delete users[S.me];F({me:null,tab:"School"})}}
 else if(a==="addfr"){const e=val("fr").trim().toLowerCase(),u=me();if(!users[e]||e===u.email){S.err="No other account with that email on this device yet.";render();return}u.friends=[...new Set([...(u.friends||[]),e])];S.err="";render()}
 else if(a==="msg")go("My Activities",{seg:"inbox",compose:{to:d.to||""}});
 else if(a==="msgorg"||a==="share"){if(!me()){F({stage:"login"});return}const o=ALL.find(x=>x.id===d.id),own=a==="msgorg";go("My Activities",{seg:"inbox",compose:own?{to:o.sponsor_email&&o.sponsor_email.split(";")[0].trim(),toName:o.sponsor,sub:"Inquiry regarding "+o.name,opp:o.id}:{sub:"Check this out: "+o.name,body:`Hi,\n\nI found this on ${BRAND} and thought you might like it: ${o.name}. ${o.description}\n\n${me().name}`,opp:o.id}})}
 else if(a==="reply"){const m=msgs.find(x=>x.id==d.id);go("My Activities",{seg:"inbox",compose:{to:m.from,sub:/^Re:/.test(m.sub)?m.sub:"Re: "+m.sub,opp:m.opp}})}
 else if(a==="cancel"){S.compose=null;render()}
 else if(a==="send"||a==="mailto"){const to=val("c_to").trim().toLowerCase(),sub=val("c_sub").trim(),body=val("c_body");if(!/.+@.+\..+/.test(to)||!sub){S.compose={...S.compose,to,sub,body};S.err="Add a valid recipient email and a subject.";render();return}
  if(a==="mailto"){location.href=`mailto:${to}?subject=${encodeURIComponent(sub)}&body=${encodeURIComponent(body)}`;return}
  msgs.push({id:Date.now(),from:S.me,to,sub,body,opp:S.compose.opp||null,t:Date.now()});S.compose=null;render()}
 else if(a==="viewopp"){const o=ALL.find(x=>x.id===d.id);if(o){S.open[o.id]=true;go(o.scope)}}
 else if(a==="dopost"){const n=val("p_name").trim(),ds=val("p_desc").trim();if(!n||ds.length<10){S.err="Add a title and a description (10+ characters).";render();return}const u=me(),sc=val("p_scope");
  const o={id:"custom-"+Date.now(),owner:S.me,scope:sc,name:n,type:val("p_type"),category:"Provider post",sponsor:u.org||u.name,sponsor_email:u.email,description:ds,good_fit_if_you_are:[],meets:val("p_when")||"See description",meeting_slots:[],location:val("p_where")||"Not provided",format:"In person",paid:"Unpaid",transportation_needed:"Yes, needs a way to get there",time_commitment:"Varies",grades:"Open",status:"Pending review",how_to_join:"Message the organizer",cost:"Not provided",key_dates:"",tags:val("p_tags").split(",").map(x=>x.trim()).filter(Boolean),activity_types:[],link:val("p_link"),notes:"Posted by "+u.name};
  indexOpp(o);ALL.push(o);custom.push(o);ck="";S.err="";go("My Activities",{seg:"post"})}
 else if(a==="delpost"){const i=custom.findIndex(o=>o.id===d.id);if(i>-1){ALL.splice(ALL.findIndex(o=>o.id===d.id),1);custom.splice(i,1);ck="";render()}}
}
/* ---------- back button: browser history ---------- */
const hv=()=>({stage:S.stage,slide:S.slide,step:S.step,tab:S.tab,seg:S.seg,q:S.q,cat:S.cat,lim:S.lim,compose:S.compose}),hk=v=>[v.stage,v.slide,v.step,v.tab,v.seg,v.compose?1:0].join("|");
let hKey="",hDepth=0,hLast=null,hY=0,hTimer=0;
const hPut=push=>{try{history[push?"pushState":"replaceState"]({bl:1,i:hDepth,v:hLast,y:hY},"")}catch(e){}};
function hSync(){if(S.stage==="loading")return;const v=hv(),k=hk(v);
 if(!hKey){hKey=k;hLast=v;hPut(false);return}
 if(k===hKey){hLast=v;clearTimeout(hTimer);hTimer=setTimeout(()=>hPut(false),300);return}
 clearTimeout(hTimer);hPut(false);hDepth++;hKey=k;hLast=v;hY=0;hPut(true)}
function hInit(){try{history.scrollRestoration="manual"}catch(e){}const s=history.state;if(s&&s.bl&&s.v){Object.assign(S,s.v);if(S.stage==="loading")S.stage="app";hDepth=s.i||0;hLast=hv();hKey=hk(hLast);hY=s.y||0}}
function goBack(fb){if(hDepth>0){const k=hKey;history.back();setTimeout(()=>{if(hKey===k)fb()},400)}else fb()}
function init(){
 try{const st=history.state,sa=(matchMedia("(display-mode: standalone)").matches)||navigator.standalone===true;let f=false;try{f=!sessionStorage.getItem("bl.visit");sessionStorage.setItem("bl.visit","1")}catch(e){}
  if(f&&!sa&&!(st&&st.bl)){S.stage="intro";S.slide=0;S.compose=null}}catch(e){}
 if(S.stage==="loading")S.stage="app";hInit();render();if(hY)scrollTo(0,hY);
 addEventListener("popstate",e=>{const s=e.state;if(!s||!s.bl||!s.v)return;clearTimeout(hTimer);Object.assign(S,s.v);S.err="";if(S.stage==="loading")S.stage="app";hDepth=s.i||0;hLast=hv();hKey=hk(hLast);hY=s.y||0;$("q").value=S.q||"";render();scrollTo(0,hY)});
 addEventListener("scroll",()=>{hY=scrollY},{passive:true});
 addEventListener("pageshow",e=>{if(e.persisted)render()});
 document.addEventListener("click",e=>{const t=e.target.closest("[data-tab],[data-act]");if(!t)return;e.preventDefault();
  if(t.dataset.act==="sk"){const s=S.ans.skills=S.ans.skills||{};(s[t.dataset.k]=s[t.dataset.k]||{})[t.dataset.w]=+t.dataset.n;[...t.parentNode.children].forEach(b=>b.classList.toggle("on",b===t));save();return}
  if(t.dataset.tab){S.q="";$("q").value="";go(t.dataset.tab,{compose:null})}else act(t.dataset.act,t.dataset)});
 document.addEventListener("change",e=>{const t=e.target;if(t.dataset.f==="anim"){S.anim=t.value;render();return}const id=t.dataset.id;if(!id)return;
  if(t.type==="checkbox")S.ans[id]=[...document.querySelectorAll(`input[data-id="${id}"]:checked`)].map(x=>x.value);else S.ans[id]=t.value;save()});
 document.addEventListener("input",e=>{const t=e.target;if(t.tagName==="TEXTAREA"&&t.dataset.id){S.ans[t.dataset.id]=t.value;save()}});
 $("q").addEventListener("input",e=>{S.q=e.target.value;if(S.q.trim())S.tab="Search";else if(S.tab==="Search")S.tab="School";render()});$("q").value=S.q}
if(typeof document!=="undefined")init();
</script></body></html>
