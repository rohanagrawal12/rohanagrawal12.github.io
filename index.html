<style>

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,select,input,textarea{font:inherit;color:inherit}
.hd{background:var(--ink);color:var(--bg);display:flex;align-items:center;gap:16px;padding:12px 20px;flex-wrap:wrap}
.brand{font-weight:700;font-size:20px;margin-right:8px}
nav{display:flex;gap:4px;flex:1}nav button{background:none;border:0;border-bottom:3px solid transparent;color:inherit;opacity:.75;padding:8px 10px;cursor:pointer;font-weight:600}

main{max-width:860px;margin:0 auto;padding:20px 16px 110px}
h1{font-size:26px;margin:0 0 6px}.mut{color:var(--mut)}
.btn{border:1px solid var(--ink);background:var(--card);border-radius:6px;padding:10px 16px;font-weight:600;cursor:pointer}

.retake{font-size:17px;padding:11px 22px}

.card h3{margin:0;font-size:19px}.meta{color:var(--mut);font-size:14px;margin:2px 0 8px}
.fit,.why{margin:6px 0;font-size:15px}.why{color:var(--mut)}
.facts{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:14px;color:var(--mut);margin:8px 0}.facts b{color:var(--ink)}
.bot{display:flex;align-items:center;justify-content:space-between;gap:28px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.match{display:flex;align-items:center;gap:10px;flex:1;font-size:14px}.meter{flex:1;max-width:200px;height:8px;background:var(--bar);border-radius:4px;overflow:hidden}.meter i{display:block;height:100%;background:var(--acc)}
.tag{font-size:12px;font-weight:700;color:var(--acc);text-transform:uppercase;letter-spacing:.04em}
.more{margin-top:12px;font-size:14px;display:grid;gap:6px}.more a{color:var(--acc)}
.quiz .q{margin:18px 0}.ql{display:block;font-weight:600;margin-bottom:6px}
textarea,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:6px;background:var(--card)}
.opt{display:block;padding:5px 0}.opt input{margin-right:8px}
.prog{height:6px;background:var(--bar);border-radius:3px;overflow:hidden}.prog i{display:block;height:100%;background:var(--acc)}
.err{color:#b3261e;min-height:22px}.row{display:flex;gap:10px;justify-content:flex-end}
.sec{margin:22px 0 8px;font-size:18px}.empty{padding:20px;border:1px dashed var(--line);border-radius:8px;color:var(--mut)}

@media(max-width:700px){.hd{padding:10px 14px}.hd input{min-width:0;flex:1}
 nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:9;justify-content:space-around;color:var(--ink)}
 nav button{border:0;font-size:12px;padding:8px 4px;flex:1}nav button.on{color:var(--acc);opacity:1}
 .bot{gap:16px}.retake{padding:11px 14px}}
</style></head>

  if(a.fmt==="In person only"&&o.format==="Online")f*=.3;
  if(a.fmt==="Online only"&&o.format==="In person")f*=.3;
  if(o.transportation_needed.startsWith("Yes")){if((a.ride||"").startsWith("No"))f*=.3;else if(a.ride==="Sometimes")f*=.8}
  if(a.paid==="Paid only"&&!/^Paid/.test(o.paid))f*=.3;
  if(o.meeting_slots.length&&free.length&&!o.meeting_slots.some(x=>free.includes(x)))f*=.7;
  if(/^Closed/.test(o.status))f*=.6;
  return{o,raw:raw*f,hit,wh}});
 const HI={};for(const r of rows)HI[r.o.scope]=Math.max(HI[r.o.scope]||0,r.raw);
 for(const r of rows){const hi=HI[r.o.scope];r.score=hi>0?Math.max(1,Math.min(10,Math.round(1+9*r.raw/hi))):1;
  r.why=r.hit.length?"Matches your interest in "+r.hit.slice(0,3).join(", ")+".":r.wh.length?"Fits what you want to do: "+r.wh[0].split(" (")[0].toLowerCase()+".":"Not a strong match for your answers yet."}
 return rows.sort((x,y)=>y.raw-x.raw||(/^Open/.test(y.o.status)-/^Open/.test(x.o.status))||x.o.name.localeCompare(y.o.name))}
/* ---------- state ---------- */
let S={tab:"School",step:0,ans:{},done:false,mine:{},seen:{},open:{},f:{fmt:"any",openOnly:false,sort:"match"},q:""};
try{const x=JSON.parse(localStorage.getItem(LS));if(x)S=Object.assign(S,x)}catch(e){}
const save=()=>{try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let cache=null,ck="";const results=()=>{const k=JSON.stringify(S.ans);if(k!==ck){cache=score(S.ans);ck=k}return cache};
/* ---------- views ---------- */
function field(q){const v=S.ans[q.id];let h="";
 if(q.k==="select")h=`<select data-id="${q.id}"><option value="">Choose…</option>${q.o.map(o=>`<option${v===o?" selected":""}>${esc(o)}</option>`).join("")}</select>`;
 else if(q.k==="text")h=`<textarea rows="3" data-id="${q.id}" placeholder="${esc(q.ph||"")}">${esc(v)}</textarea>`;
 else if(q.k==="radio")h=q.o.map(o=>`<label class="opt"><input type="radio" name="${q.id}" data-id="${q.id}" value="${esc(o)}"${v===o?" checked":""}>${esc(o)}</label>`).join("");
 else h=q.o.map(o=>`<label class="opt"><input type="checkbox" data-id="${q.id}" data-max="${q.max||99}" value="${esc(o)}"${(v||[]).includes(o)?" checked":""}>${esc(o)}</label>`).join("");
 return`<div class="q"><label class="ql">${q.t}${q.opt?"":" *"}</label>${h}</div>`}
function quizView(){const p=PAGES[S.step];return`<section class="quiz"><div class="prog"><i style="width:${(S.step+1)/PAGES.length*100}%"></i></div><p class="mut">Section ${S.step+1} of ${PAGES.length}</p><h1>${p.title}</h1>${S.step===0?`<p class="mut">Tell us what you’re into, in your own words, and we’ll put the clubs and opportunities that fit you best at the top of your list. Takes about 2 minutes.</p><p class="mut">Your answers are only used to rank opportunities for you and stay on this device.</p>`:""}${p.intro?`<p class="mut">${p.intro}</p>`:""}${p.q.map(field).join("")}<div class="err" id="err"></div><div class="row">${S.step?`<button class="btn" data-act="back">Back</button>`:""}<button class="btn pri" data-act="next">${S.step===PAGES.length-1?"See my results":"Next"}</button></div></section>`}
function card(r,i){const o=r.o,id=o.id,open=S.open[id],mine=S.mine[id];
 return`<article class="card"><h3>${esc(o.name)}</h3><div class="meta">${esc(o.type)} · ${o.scope==="School"?"Sponsor":"Host"}: ${esc(o.sponsor)}</div><p style="margin:0">${esc(o.description)}</p>
<p class="fit"><b>Good fit if you are:</b> ${esc(o.good_fit_if_you_are.join(", "))}</p><p class="why">${esc(r.why)}</p>
<div class="facts"><span><b>Meets:</b> ${esc(o.meets)}</span><span><b>Time:</b> ${esc(o.time_commitment)}</span><span><b>Grades:</b> ${esc(o.grades)}</span><span><b>Status:</b> ${esc(mine?"Already in":o.status)}</span></div>
${open?`<div class="more"><span><b>How to join:</b> ${esc(o.how_to_join)}</span><span><b>Where:</b> ${esc(o.location)} (${esc(o.format)})</span><span><b>Cost / pay:</b> ${esc(o.cost)} · ${esc(o.paid)}</span>${o.key_dates?`<span><b>Key dates:</b> ${esc(o.key_dates)}</span>`:""}${o.sponsor_email?`<span><b>Contact:</b> ${esc(o.sponsor_email)}</span>`:""}${o.link?`<a href="${esc(o.link)}" target="_blank" rel="noopener">Visit website</a>`:""}${o.notes?`<span class="mut">${esc(o.notes)}</span>`:""}<span><button class="btn" data-act="mine" data-id="${id}">${mine?"Remove from My Activities":"I’m already in this"}</button></span></div>`:""}
<div class="bot"><div class="match">${i<3&&r.score>=7?`<span class="tag">Best match</span>`:""}<span>Match level</span><span class="meter"><i style="width:${r.score*10}%"></i></span><b>${r.score} / 10</b></div><button class="btn pri" data-act="explore" data-id="${id}">${open?"Hide":"Explore"}</button></div></article>`}
function listView(){const tab=S.tab;if(tab==="School"&&!(S.ans.school||"").startsWith("The Village"))return`<h1>Clubs at your school</h1><div class="empty">We don’t have a club list for your school yet. Check the Community and Explore tabs.</div>`;
 const q=S.q.toLowerCase(),f=S.f;let rows=results().filter(r=>r.o.scope===tab&&!S.mine[r.o.id]);
 if(q)rows=rows.filter(r=>(r.o.name+" "+r.o.description+" "+r.o.tags.join(" ")+" "+r.o.category).toLowerCase().includes(q));
 if(f.fmt!=="any")rows=rows.filter(r=>r.o.format.includes(f.fmt));if(f.openOnly)rows=rows.filter(r=>/^(Open|Sign-ups|Contact)/.test(r.o.status));
 if(f.sort==="az")rows=[...rows].sort((a,b)=>a.o.name.localeCompare(b.o.name));
 const title={School:"Clubs at your school",Community:"Community opportunities in Houston",Explore:"Explore programs, internships and competitions"}[tab];
 const heard=[...terms([S.ans.learn,S.ans.free,S.ans.make,S.ans.self].join(" ")).values()].filter(x=>x[0]>=1).map(x=>x[1]);
 return`<h1>${title}</h1><p class="mut">Sorted by your quiz answers, best match first. <a href="#" data-act="mypage" style="color:var(--acc)">See your results and what you’re already doing</a></p>
<div class="bar"><details class="flt"><summary>Filters</summary><div class="panel"><label>Format <select data-f="fmt"><option value="any">Any</option><option${f.fmt==="In person"?" selected":""}>In person</option><option${f.fmt==="Online"?" selected":""}>Online</option></select></label><label><input type="checkbox" data-f="openOnly"${f.openOnly?" checked":""}> Only show open or contact-to-join</label><label>Sort <select data-f="sort"><option value="match">Best match</option><option value="az"${f.sort==="az"?" selected":""}>A to Z</option></select></label></div></details><button class="btn retake" data-act="retake">Retake quiz</button></div>
${rows.length?rows.map(card).join(""):`<div class="empty">Nothing matches that search or filter.</div>`}`}
function myView(){const R=results(),mine=R.filter(r=>S.mine[r.o.id]),seen=R.filter(r=>S.open[r.o.id]&&!S.mine[r.o.id]);
 const heard=[...new Set([...terms([S.ans.learn,S.ans.free,S.ans.make,S.ans.self].join(" ")).values()].filter(x=>x[0]>=1).map(x=>x[1]))].slice(0,14);
 const a=S.ans;return`<h1>My Activities</h1><h2 class="sec">Your quiz results</h2><p class="mut">Here’s what we heard from your answers:</p><div class="chips">${heard.map(w=>`<span class="chip">${esc(w)}</span>`).join("")||"<span class='mut'>Nothing yet. Take the quiz.</span>"}</div>
<p class="mut">${esc(a.grade||"")} · ${esc(a.school||"")}<br>Wants to: ${esc((a.want||[]).join(", ")||"–")}<br>Reasons: ${esc((a.why||[]).join(", ")||"–")} · Time: ${esc(a.time||"–")} · Format: ${esc(a.fmt||"–")}</p><p><button class="btn" data-act="retake">Retake quiz</button></p>
<h2 class="sec">What you’re already doing</h2>${mine.length?mine.map(card).join(""):`<div class="empty">Nothing yet. Open an opportunity and choose “I’m already in this.”</div>`}
<h2 class="sec">Opportunities you’ve explored</h2>${seen.length?seen.map(card).join(""):`<div class="empty">Tap Explore on any opportunity and it will show up here.</div>`}`}
function render(){document.getElementById("brand").textContent=APP;
 const nav=document.getElementById("nav");nav.style.visibility=S.done?"visible":"hidden";nav.innerHTML=TABS.map(t=>`<button class="${t===S.tab?"on":""}" data-tab="${t}">${t}</button>`).join("");
 document.getElementById("q").style.visibility=S.done?"visible":"hidden";
 document.getElementById("main").innerHTML=!S.done?quizView():S.tab==="My Activities"?myView():listView();save()}
/* ---------- events ---------- */
function valid(){const p=PAGES[S.step];for(const q of p.q){if(q.opt)continue;const v=S.ans[q.id];if(!v||(Array.isArray(v)&&!v.length)||(typeof v==="string"&&v.trim().length<(q.k==="text"?3:1)))return"Please answer: "+q.t.replace(/ \(.*\)/,"")}return""}
function init(){render();
 document.addEventListener("click",e=>{const t=e.target.closest("[data-tab],[data-act]");if(!t)return;
  if(t.dataset.tab){S.tab=t.dataset.tab;render();scrollTo(0,0);return}
  const a=t.dataset.act,id=t.dataset.id;e.preventDefault();
  if(a==="settings")dlg.showModal();else if(a==="close")dlg.close();
  else if(a==="next"){const m=valid();if(m){err.textContent=m;return}if(S.step<PAGES.length-1)S.step++;else{S.done=true;S.tab=(S.ans.school||"").startsWith("The Village")?"School":"Explore"}render();scrollTo(0,0)}
  else if(a==="back"){S.step=Math.max(0,S.step-1);render()}
  else if(a==="retake"){S.done=false;S.step=0;S.tab="School";dlg.open&&dlg.close();render();scrollTo(0,0)}
  else if(a==="clear"){S={tab:"School",step:0,ans:{},done:false,mine:{},seen:{},open:{},f:S.f,q:""};try{localStorage.removeItem(LS)}catch(x){}dlg.close();render()}
  else if(a==="explore"){S.open[id]=!S.open[id];render()}
  else if(a==="mine"){S.mine[id]=!S.mine[id];render()}
  else if(a==="mypage"){S.tab="My Activities";render()}});
 document.addEventListener("change",e=>{const t=e.target;
  if(t.dataset.f){S.f[t.dataset.f]=t.type==="checkbox"?t.checked:t.value;render();return}
  const id=t.dataset.id;if(!id)return;
  if(t.type==="checkbox"){const box=[...document.querySelectorAll(`input[data-id="${id}"]:checked`)];if(box.length>+t.dataset.max){t.checked=false;return}S.ans[id]=box.map(x=>x.value)}
  else S.ans[id]=t.value;save()});
 document.addEventListener("input",e=>{const t=e.target;if(t.tagName==="TEXTAREA"){S.ans[t.dataset.id]=t.value;save()}});
 document.getElementById("q").addEventListener("input",e=>{S.q=e.target.value;if(S.tab==="My Activities")S.tab="School";render()});
 document.getElementById("q").value=S.q}
if(typeof document!=="undefined")init();
</script></body></html>
