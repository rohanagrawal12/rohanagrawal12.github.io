<style>
/* Colours and basic settings for the light theme. Every colour in the page comes from these variables: background */
/* (--bg), cards (--card), text (--ink), softer text (--mut), outlines (--line), accent (--acc), soft fill */
/* (--soft), buttons (--btn, --onbtn) and the top bar (--bar, --onbar). It also leaves room for a phone's notch */

:root{--bg:#F3F3F4;--card:#fff;--ink:#111113;--mut:#4F4F56;--line:#C4C4CA;--acc:#111113;--soft:#EBEBED;--btn:#111113;--onbtn:#fff;--bar:#111113;--onbar:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

/* The Dark theme chosen in Settings. */
:root[data-theme="dark"]{--bg:#0C0C0E;--card:#161618;--ink:#EDEDEF;--mut:#A8A8B0;--line:#3B3B41;--acc:#EDEDEF;--soft:#1F1F23;--btn:#EDEDEF;--onbtn:#111113;--bar:#000;--onbar:#fff}

:root[data-theme="marker"]{--bg:#000;--card:#0C0C0C;--ink:#F7F7F2;--mut:#B4B4AC;--line:#3D3D3D;--acc:#F7D63E;--soft:#161616;--btn:#F7D63E;--onbtn:#000;--bar:#000;--onbar:#F7D63E}

:root[data-theme="yellow"]{--bg:#FBF8EE;--card:#fff;--ink:#1A1A1A;--mut:#55503F;--line:#CDC4A3;--acc:#B72D1A;--soft:#F3EDDA;--btn:#1A1A1A;--onbtn:#F7D63E;--bar:#F7D63E;--onbar:#1A1A1A}
/* Sizes include padding and border everywhere. The top of the page is padded for a phone's notch, and that strip */
/* is painted with the bar colour. */
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}html::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bar);z-index:40}

/* a backup). */
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
/* Buttons and boxes use the page's font and colour. Links use the accent colour and are bold. */
button,select,input,textarea{font:inherit;color:inherit}a{color:var(--acc);font-weight:600}
/* The full-screen area (welcome, forms, quiz) is hidden until a full-screen stage shows. Then the header, the */
/* main page and the bottom bar are hidden. */
#full{display:none}body.full #full{display:block}body.full .hd,body.full main,body.full .bn{display:none}
/* The header: it sticks to the top and uses the bar colours. */
.hd{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bar);color:var(--onbar)}
/* The header's inner row: centered, with its items in a line and gaps between them. */
.in{max-width:1240px;margin:auto;display:flex;align-items:center;gap:20px;padding:14px 28px}

.lg{display:grid;place-items:center;width:40px;height:40px;border-radius:6px;background:#fff;border:2px solid var(--onbar)}.lg svg{width:26px;height:26px}

/* The search box in the header. */
.sr{flex:0 1 320px;width:320px;min-width:120px;padding:10px 14px;border:0;border-radius:5px;background:var(--card);color:var(--ink);font-size:16px}
/* The square Settings button in the header. */
.gb{display:grid;place-items:center;width:42px;height:42px;border-radius:5px;border:2px solid var(--onbar);background:transparent;color:var(--onbar);cursor:pointer}
/* The main page area: centered, with space around it and room at the bottom for the phone's bottom bar. */
main{max-width:1240px;margin:auto;padding:36px 28px 120px}
/* The sizes and weights of the three heading levels. */
h1{font-size:34px;line-height:1.15;margin:4px 0 8px;font-weight:800;letter-spacing:-.02em}h2{font-size:20px;margin:36px 0 12px;font-weight:800}h3{margin:0;font-size:19px;font-weight:800}
/* Small capital labels above headings (.eyebrow), gray text (.mut) and small gray notes (.meta). */
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.14em;color:var(--acc);text-transform:uppercase}.mut{color:var(--mut)}.meta{font-size:13px;color:var(--mut)}
/* Buttons: outlined with slightly rounded corners (.btn), the filled black one (.pri), the bigger one (.big), and */

.btn{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;padding:11px 18px;font-weight:700;font-size:15px;cursor:pointer;display:inline-block;white-space:nowrap}.btn:hover{border-color:var(--mut)}.btn.pri{background:var(--btn);border-color:var(--btn);color:var(--onbtn)}.btn.big{padding:14px 22px;font-size:16px;width:100%}.btn:disabled{opacity:.5;cursor:not-allowed}
/* Link-style buttons (.lk): no box, accent colour, underline on hover, plus an underlined variant (.u). */

/* The category chips above the lists, and the chosen chip (.on). */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 6px}.chp{border:1.5px solid var(--line);background:var(--card);border-radius:8px;padding:8px 16px;font-weight:600;cursor:pointer}.chp.on{background:var(--btn);border-color:var(--btn);color:var(--onbtn)}
/* The row with the number of results. */
.cnt{display:flex;justify-content:space-between;align-items:center;margin:18px 0 6px;font-weight:700}
/* A grid of cards (an older layout; the lists now use .lst). */
.cg{display:grid;grid-template-columns:repeat(auto-fill,minmax(440px,1fr));gap:18px;margin-top:14px}
/* The card box of the older layout, with its title, subtitle and open state. */
.card{position:relative;background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:20px;display:flex;flex-direction:column;gap:8px}.card.open{grid-column:1/-1}.card h3{padding-right:44px}.sub{font-size:14px;color:var(--mut)}.ds{margin:0}.cl{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.mt2{font-size:14px}
/* The bookmark (save) button in the corner of a card, and its saved look (.on). */
.bm{position:absolute;top:14px;right:14px;width:38px;height:38px;border:1.5px solid var(--line);border-radius:5px;background:var(--card);display:grid;place-items:center;cursor:pointer;color:var(--ink)}.bm.on{color:var(--acc);border-color:var(--acc)}
/* The bottom row of a card, with the hint text and the match meter. */
.foot{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:8px;padding-top:14px;border-top:1px solid var(--line)}.hint{font-size:13px;color:var(--mut)}.mm{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600}.meter{display:block;width:84px;height:6px;background:var(--line);border-radius:2px;overflow:hidden}.meter i{display:block;height:100%;background:var(--acc)}
/* The expanded details of an open card (.more) and a simple wrapping row (.row). */
.more{display:grid;gap:6px;font-size:14px;padding:12px 14px;background:var(--soft);border-radius:6px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
/* The section buttons on My Activities (Saved, I'm doing and so on), with the chosen one filled. */
.segs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.segs button{border:1.5px solid var(--line);background:var(--card);border-radius:6px;padding:9px 16px;font-weight:700;cursor:pointer}.segs button.on{background:var(--btn);border-color:var(--btn);color:var(--onbtn)}
/* The empty-state box: a centered card with an icon, a title and a button. */
.es{text-align:center;max-width:460px;margin:20px auto;padding:36px 24px;border:1.5px solid var(--line);border-radius:8px;background:var(--card)}.esi{display:grid;place-items:center;width:64px;height:64px;margin:0 auto 12px;border-radius:10px;background:var(--soft);color:var(--acc)}.es h2{margin:8px 0}
/* Panels (boxes with a heading, used in Settings and Admin) and the option buttons inside them (.opts, .optc). */
.pnl{border:1.5px solid var(--line);border-radius:8px;padding:20px;margin:16px 0;background:var(--card)}.pnl h2{margin:0 0 12px}.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}.optc{border:1.5px solid var(--line);background:var(--bg);border-radius:6px;padding:14px;font-weight:700;cursor:pointer;text-align:left}.optc.on{border-color:var(--acc);color:var(--acc)}
/* Empty-list text (.empty), the quote style (.quote) and the red error text (.err). */
.empty{padding:18px 0;color:var(--mut)}.quote{font-style:italic;color:var(--mut);border-left:3px solid var(--acc);padding-left:14px}.err{color:#d93025;min-height:22px}
/* On the account forms the error line takes no room until it has a message. */

/* The notice box (.inf) for messages like "We sent a new code". */
.inf{border:1.5px solid var(--line);border-radius:6px;padding:11px 14px;margin:14px 0;background:var(--soft);font-size:15px}
/* The centered form box (.box), a wider one (.wide), question blocks (.q) and their labels (.ql). */
.box{max-width:520px;margin:20px auto;text-align:left;width:100%}.box p{overflow-wrap:anywhere}.wide{max-width:820px}.q{margin:22px 0}.ql{display:block;font-weight:700;margin-bottom:8px}
/* Text boxes, text areas and drop-downs all look the same: full width, outlined, slightly rounded. */
input[type=text],input[type=email],input[type=password],input[type=url],textarea,select.f,.pnl select{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);font-size:16px}
/* The quiz's answer choices (tick boxes and radio buttons drawn as buttons). A chosen one gets the accent */
/* outline. */
.opt{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:6px;padding:10px 14px;margin:0 8px 8px 0;background:var(--card);cursor:pointer}.opt:has(input:checked){border-color:var(--acc);background:var(--soft)}.opt input{margin:0;accent-color:var(--acc)}
/* The skills table on the last quiz page and its 1 to 5 buttons (.seg). */
.sk{display:grid;grid-template-columns:1fr 1.5fr 1.5fr;gap:12px;align-items:center;font-size:14px;margin:10px 0}.skh{font-size:12px}.sl{display:none}.seg{display:flex;gap:4px}.seg button{flex:1;min-width:34px;padding:9px 0;border:1.5px solid var(--line);background:var(--card);color:var(--mut);cursor:pointer;font-weight:700;border-radius:5px}.seg button.on{background:var(--btn);border-color:var(--btn);color:var(--onbtn)}
/* Message rows in the Inbox and Friends, and small text (.chip, .cell). */
.mail{padding:16px 0;border-bottom:1px solid var(--line)}.mail pre{white-space:pre-wrap;font:inherit;margin:8px 0}.chip,.cell{font-size:14px}
/* The full-screen stages (account step, quiz step, quiz, loading): one centered column. */
.fs{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px 24px;max-width:560px;margin:0 auto}.fs.left{align-items:stretch;justify-content:flex-start;text-align:left;max-width:760px}

.fs .ico{display:grid;place-items:center;width:92px;height:92px;border-radius:12px;background:var(--soft);color:var(--acc);margin-bottom:10px}.fs .ico svg{width:56px;height:56px}
/* A vertical stack of buttons (.stack), the "or" text, and the small note under forms. */
.stack{display:grid;gap:12px;width:100%;margin-top:18px}.or{color:var(--mut);font-size:14px}.note{font-size:12.5px;color:var(--mut);margin-top:18px}
/* The quiz header (logo and "1 of 4"), bold text (.b) and the progress dashes (.segp). */
.qh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.b{font-weight:800}.segp{display:flex;gap:6px;margin-bottom:22px}.segp i{flex:1;height:5px;border-radius:2px;background:var(--line)}.segp i.on{background:var(--acc)}.qf{display:flex;justify-content:space-between;gap:12px;margin-top:12px}
/* The loading progress bar. */
.pbar{width:100%;height:8px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:18px}.pbar i{display:block;height:100%;width:4%;background:var(--acc);transition:width .14s linear}
/* The welcome screens (.sl2) are three tall pages, each with its own colour: .y light, .k dark and .r gray. --ln is the outline colour and --mu the quieter text colour on that page. */
.sl2{min-height:100vh;--ln:#111113;--mu:#4F4F56}.sl2.y{background:#F3F3F4;color:#111113}.sl2.k{background:#0C0C0E;color:#EDEDEF;--ln:rgba(255,255,255,.4);--mu:#B8B8BF}.sl2.r{background:#2A2A2E;color:#fff;--ln:rgba(255,255,255,.4);--mu:#C8C8CE}.sl2.y .wbtn{background:#111113;color:#fff}
/* The page column (.w-wrap): centered, at most 1088 px wide, with side space (more on bigger screens). */
.w-wrap{width:100%;max-width:1088px;margin:0 auto;padding:0 20px}@media(min-width:640px){.w-wrap{padding:0 32px}}
/* Each page is a stack of bands (.w-band), full-width sections. A plain band uses the page colour. .w-white is white, .w-ink is black and .w-red is the brand red. .w-line adds a thin line on top, and .w-first is the top band, which holds the logo row. */
.w-band{padding:48px 0}.w-band.w-first{padding:0 0 40px}.w-line{border-top:1px solid var(--ln)}.w-white{background:#fff;color:#111113;border-top:1px solid #C4C4CA;border-bottom:1px solid #C4C4CA;--ln:#111113;--mu:#4F4F56}.w-ink{background:#111113;color:#fff;--ln:rgba(255,255,255,.4);--mu:#B8B8BF}.w-red{background:#D6452F;color:#fff;--ln:#fff;--mu:#fff}@media(min-width:900px){.w-band{padding:84px 0}.w-band.w-first{padding:0 0 72px}}
/* The top row of a welcome page: the logo on the left and the corner button (.pill) on the right. */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;font-weight:800;font-size:20px;padding-top:22px}.pill{border:1.5px solid currentColor;background:transparent;color:inherit;border-radius:5px;padding:8px 12px;font-weight:700;font-size:13px;cursor:pointer}
/* On very small phones the corner button drops its first words so the logo and the button fit side by side. */
@media(max-width:380px){.w-nn{display:none}}
/* Big, tight headlines. There is one h1 on each page. The h2 and h3 are for the sections under it. */
.sl2 h1{font-size:clamp(42px,11.5vw,80px);line-height:1;letter-spacing:-.035em;margin:14px 0 18px;text-wrap:balance}.sl2 h2{font-size:clamp(28px,7.4vw,48px);line-height:1.06;letter-spacing:-.03em;margin:10px 0 14px;text-wrap:balance}.sl2 h3{font-size:19px;line-height:1.25;margin:0 0 6px}.sl2 :where(p){margin:0 0 14px}
/* The first paragraph under a headline (.w-lead), the small gray line (.w-fine) and the small label above a headline (.cap). */
.w-lead{font-size:clamp(18px,4.8vw,22px);line-height:1.45;max-width:560px;text-wrap:pretty}.w-fine{font-size:14px;color:var(--mu);margin:14px 0 0}.cap{font-size:12px;font-weight:800;letter-spacing:.2em}

.w-hero{display:grid;gap:36px;align-items:center;padding-top:30px}@media(min-width:900px){.w-hero{grid-template-columns:1.1fr .9fr;gap:56px;padding-top:64px}}

.w-cards{display:grid;gap:14px;margin-top:28px}@media(min-width:760px){.w-cards{grid-template-columns:repeat(3,1fr);gap:18px}}.w-card{background:#F3F3F4;border:1.5px solid #C4C4CA;border-top:5px solid #111113;border-radius:8px;padding:20px 20px 8px}.w-card p{color:var(--mu);font-size:16px}

.w-num{flex:none;width:30px;height:30px;border:1.5px solid currentColor;border-radius:6px;display:grid;place-items:center;font-size:14px;font-weight:800}
/* The four steps of how Bulletin got built: two columns on a tablet, four on a computer. */

/* --pin: the brand red, used for the tour's ring. */
:root{--pin:#D6452F}
/* The tour card: fixed on screen above everything else, outlined, and it scrolls if it is taller than the screen. */
.tour{position:fixed;z-index:60;box-sizing:border-box;max-height:calc(100vh - 24px);overflow:auto;background:var(--card);color:var(--ink);border:2px solid var(--ink);border-radius:8px;padding:16px 18px 14px;box-shadow:0 10px 30px rgba(0,0,0,.22)}
/* The "1 of 8" label on the tour card. */
.tour-n{font-size:12px;font-weight:800;letter-spacing:.14em;color:var(--mut);text-transform:uppercase}
/* The tour card's title. */
.tour h2{margin:4px 0 6px;font-size:19px;line-height:1.25}
/* The tour card's words. */
#tour-x{font-size:15px;line-height:1.45}
/* The little list inside the tour card (the tabs step). */
.tour-l{list-style:none;margin:0 0 10px;padding:0}.tour-l li{display:flex;gap:12px;padding:3px 0}.tour-l b{flex:none;width:108px}
/* The tour card's button row: Skip tour on the left, Back and Next on the right. */
.tour-b{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px}.tour-b span{display:flex;gap:8px;margin-left:auto}
/* The red ring around what the tour points at (on the bottom bar it is drawn inward so it is not cut off). */
.tour-hl{outline:3px solid var(--pin);outline-offset:3px}#bn.tour-hl{outline-offset:-3px}
/* The email code box: big numbers with wide spacing, centered. */
.vc{font-size:24px;letter-spacing:.3em;text-align:center}

// SYN: shortcuts from one word to related words, so "doctor" also finds "medicine" and "healthcare".
const SYN={bio:"biology science",doctor:"medicine healthcare",doctors:"medicine healthcare",medical:"medicine healthcare",nurse:"healthcare medicine",coding:"coding computer programming",code:"coding computer programming",programming:"coding computer",computers:"computer coding",app:"app development coding",apps:"app development coding",drawing:"art design",paint:"art",painting:"art",sing:"singing music karaoke",singing:"music karaoke",acting:"theater acting",movies:"video media",film:"video media",youtube:"video media podcast",write:"writing journalism",writing:"writing journalism books",story:"storytelling writing",stories:"storytelling writing",reading:"books reading",gaming:"video games esports",games:"games video",soccer:"sports fitness",basketball:"sports fitness",football:"sports fitness",gym:"fitness sports",workout:"fitness sports",animals:"animals shelter",dogs:"animals shelter",cats:"animals shelter",pets:"animals shelter",nature:"environment",climate:"environment sustainability",money:"business finance",stocks:"stocks investing finance",business:"business entrepreneurship finance",startup:"entrepreneurship business",law:"law legal debate",lawyer:"law legal debate",speaking:"public speaking debate",speech:"public speaking debate",politics:"civics international relations law",government:"civics law",volunteer:"volunteering service",helping:"service volunteering community",teaching:"tutoring teaching mentoring",tutor:"tutoring teaching",robots:"robotics engineering",building:"engineering building",build:"engineering building",space:"space aerospace",cooking:"cooking culinary food",baking:"cooking food",food:"cooking food",brain:"neuroscience psychology",math:"math competition"};
// SUF: word endings that get cut off, so "building" and "builds" count as the same word.
const SUF=["ive","ion","ing","ed","es","ly","s"];
// stem(w): cuts the endings in SUF off a word (up to two times) and a final "e", to get its basic form.
function stem(w){for(let p=0;p<2;p++){for(const s of SUF)if(w.length-s.length>=4&&w.endsWith(s)){w=w.slice(0,-s.length);break}}return w.length>4&&w.endsWith("e")?w.slice(0,-1):w}
// terms(t): turns a piece of text into a map of basic words, each with a weight. A word that repeats counts a bit
// more (up to 1.5). Short words and STOP words are skipped.
function terms(t){const m=new Map();for(const w of String(t||"").toLowerCase().replace(/[^a-z\s]/g," ").split(/\s+/)){if(w.length<3||STOP.has(w))continue;const s=stem(w);if(!m.has(s))m.set(s,[1,w]);else m.get(s)[0]=Math.min(1.5,m.get(s)[0]+.25);
 // For each word that has shortcuts in SYN, also adds the related words, with a smaller weight (0.6).
 if(SYN[w])for(const x of SYN[w].split(" ")){const sx=stem(x);if(!m.has(sx))m.set(sx,[.6,w])}}return m}
// addIdx(m,t,w): adds the words of a text to an opportunity's word list m with weight w. If a word is already there,

function addIdx(m,t,w){for(const s of terms(t).keys())m.set(s,Math.max(m.get(s)||0,w))}
// DF: for each word, how many opportunities contain it. It is used so that rare words count for more than common

for(const o of ALL){o.idx=new Map();addIdx(o.idx,o.tags.join(" "),3);addIdx(o.idx,o.name,2);addIdx(o.idx,o.category,2);addIdx(o.idx,o.good_fit_if_you_are.join(" "),1.5);addIdx(o.idx,o.description,1);for(const s of o.idx.keys())DF.set(s,(DF.get(s)||0)+1)}
// idf(s): how rare a word is. A common word gives a small number and a rare word a bigger one.

 // Asks the database for this person's profile row and all their saved or doing items (the database only gives back
 // their own rows).
 const uid=SBS.uid,[pr,ar]=await Promise.all([sbReq("/rest/v1/profiles?id=eq."+uid+"&select=name,role,is_provider,org,quiz_answers"),sbReq("/rest/v1/activity?select=opp_id,kind")]);
 // If the person logged out or changed while waiting, stop.
 if(!sbIn()||SBS.uid!==uid)return false;
 // If either answer failed, remember that the data has not loaded yet and give up for now.
 if(!pr.ok||!ar.ok||!Array.isArray(pr.j)||!Array.isArray(ar.j)){sbNeedPull=true;return false}
 // p: the profile row (nothing if the account has none yet).
 let p=pr.j[0];
 // No profile row yet: build one from the sign-up details (or the device copy).
 if(!p){const m=SBS.meta||{},x=me()||{};p={name:m.name||x.name||SBS.email.split("@")[0],role:m.role||x.role||"Student",is_provider:!!(m.provider||x.provider),org:m.org||x.org||null};
  // Saves that new profile row online (or updates it if one appeared in the meantime).
  const w=await sbReq("/rest/v1/profiles?on_conflict=id",{method:"POST",headers:{Prefer:"resolution=merge-duplicates,return=minimal"},body:{id:uid,...p}});if(!sbIn()||SBS.uid!==uid)return false;if(!w.ok){sbNeedPull=true;return false}}
 // Makes or updates the device copy of the account from the profile (name, role, organizer, organization).
 const e=SBS.email,u=users[e]=Object.assign(users[e]||{friends:[]},{name:p.name,email:e,role:p.role,provider:!!p.is_provider,org:p.org||"",sb:1});delete u.pw;delete u.ans;S.me=e;
 // sa: the quiz answers saved online (null if none). taking: true while the person is in the middle of the quiz.
 const sa=p.quiz_answers&&typeof p.quiz_answers==="object"&&!Array.isArray(p.quiz_answers)&&Object.keys(p.quiz_answers).length?p.quiz_answers:null,taking=S.stage==="quiz"||S.stage==="loading";
 // Unless the quiz is being taken: the online answers win, unless the quiz was finished here and not sent yet
 // (dirty). In that case the answers here are marked to be sent.
 if(!taking){if(sa&&!SBS.dirty){S.ans=sa;S.done=true}else if(S.done&&Object.keys(S.ans||{}).length)SBS.dirty=true}
 // srv: the saved and doing ids the server has.
 const srv={saved:new Set(),doing:new Set()};for(const r of ar.j)if(srv[r.kind])srv[r.kind].add(r.opp_id);
 // For saved and for doing: take what the server has, add what this device added since the last sync, and remove what
 // this device removed since then.
 for(const k of KINDS){const l=sbLocal(k),n=new Set(SBS.known[k]),f=new Set(srv[k]);for(const x of l)if(!n.has(x))f.add(x);for(const x of n)if(!l.has(x))f.delete(x);
  // Stores the merged result in S.saved or S.mine, and remembers what the server had (known) for next time.
  const m={};for(const x of f)m[x]=true;if(k==="saved")S.saved=m;else S.mine=m;SBS.known[k]=[...srv[k]]}
 // Done: forgets the sign-up details, saves the login, marks the data as loaded, clears the cache and sends anything
 // that still differs.
 delete SBS.meta;sbSave();sbNeedPull=false;ck="";await sbFlush();return true}
/* send what is different: quiz answers, then saved and "I'm doing" items. Safe to run again at any time. */
// sbFlush(): sends what is different. If it is already running, it asks the running one to go round once more.
async function sbFlush(){if(!sbIn())return;if(sbRun){sbAgain=true;return}
 // Marks that a send is running. ok turns false if any part fails.
 sbRun=true;let ok=true;
 // Each time round the loop sends the quiz answers, then new items, then removed items. up asks the database to merge
 // duplicates instead of failing.
 try{do{sbAgain=false;const uid=SBS.uid,up={Prefer:"resolution=merge-duplicates,return=minimal"};
  // If quiz answers are waiting: sends them with the profile (an upsert). snap is a copy to compare with afterwards.
  if(SBS.dirty){const u=me()||{},snap=JSON.stringify(S.ans),r=await sbReq("/rest/v1/profiles?on_conflict=id",{method:"POST",headers:up,body:{id:uid,name:u.name||SBS.email.split("@")[0],role:u.role||"Student",is_provider:!!u.provider,org:u.org||null,quiz_answers:S.ans}});
   // If the person left in the meantime, stop. If it worked and the answers did not change while sending, they are no
   // longer waiting. If they did change, go round again. A failure sets ok to false.
   if(!sbIn()||SBS.uid!==uid)return;if(r.ok){if(JSON.stringify(S.ans)===snap)SBS.dirty=false;else sbAgain=true;sbSave()}else ok=false}
  // add: items to send. del: items to remove, for saved and for doing.
  const add=[],del={saved:[],doing:[]};
  // Compares this device with what the server knew: new on this device means add, gone from this device means delete
  // (only ids made of safe characters).
  for(const k of KINDS){const l=sbLocal(k),n=new Set(SBS.known[k]);for(const x of l)if(!n.has(x))add.push({user_id:uid,opp_id:x,kind:k});for(const x of n)if(!l.has(x)&&/^[\w.-]+$/.test(x))del[k].push(x)}
  // Sends the new items (an upsert). On success they count as known.
  if(add.length){const r=await sbReq("/rest/v1/activity?on_conflict=user_id,opp_id,kind",{method:"POST",headers:up,body:add});if(!sbIn()||SBS.uid!==uid)return;if(r.ok){for(const a of add)SBS.known[a.kind].push(a.opp_id);sbSave()}else ok=false}
  // Sends the removals, one request per kind. On success they are no longer known.
  for(const k of KINDS)if(del[k].length){const r=await sbReq("/rest/v1/activity?user_id=eq."+uid+"&kind=eq."+k+"&opp_id=in.("+del[k].join(",")+")",{method:"DELETE",headers:{Prefer:"return=minimal"}});if(!sbIn()||SBS.uid!==uid)return;if(r.ok){const s=new Set(del[k]);SBS.known[k]=SBS.known[k].filter(x=>!s.has(x));sbSave()}else ok=false}
 // Goes round again if something changed while sending (and nothing failed). The finally part always marks the send
 // as finished.
 }while(sbAgain&&ok)}finally{sbRun=false}
 // If everything worked, resets the failure count. If not, tries again later with a growing wait (15 seconds, 30
 // seconds, and so on, never more than 2 minutes) up to 5 times.
 if(ok)sbFails=0;else{sbFails++;if(sbFails<=5){clearTimeout(sbTimer);sbTimer=setTimeout(sbFlush,Math.min(120000,15000*sbFails))}}}
// sbQueue(): schedules a send 600 ms from now, so a quick series of taps goes out in one go.
function sbQueue(){if(!sbIn())return;clearTimeout(sbTimer);sbFails=0;sbTimer=setTimeout(sbFlush,600)}
/* ---------- Admin. The database decides who is an admin (the "admins" table, filled in by supabase/admin.sql). The site only shows or hides the button. Every admin call is checked again in the database, and the numbers are kept in memory only. ---------- */
// sbAdmin(): true when the logged-in person's login says they are an admin. The database decides; this only shows or
// hides the Admin button.
const sbAdmin=()=>!!(sbIn()&&SBS.adm);
// sbAdminCheck(): asks the database "am I an admin?" and remembers the answer in the login. It does nothing if the
// Admin SQL is not installed.
async function sbAdminCheck(){if(!sbIn()||ADMNO)return sbAdmin();const uid=SBS.uid,r=await sbReq("/rest/v1/rpc/is_admin",{method:"POST",body:{}});
 // If the person changed while waiting, stop.
 if(!sbIn()||SBS.uid!==uid)return false;
 // A true or false answer: remembers it (and forgets the Admin numbers if false) and hands it back.
 if(r.ok&&typeof r.j==="boolean"){if(!!SBS.adm!==r.j){SBS.adm=r.j;sbSave()}if(!r.j){ADM=null;ADMERR=""}return r.j}
 // The function does not exist (the SQL has not been run): remembers that so the page stops asking, and says not an
 // admin.
 if(r.status===404||(r.j&&r.j.code==="PGRST202")){ADMNO=true;if(SBS.adm){SBS.adm=false;sbSave()}return false}
 // Any other problem: keeps whatever was known before.
 return sbAdmin()}
// admLoad(): loads the Admin page's numbers from the database (only for admins, and only one request at a time).
function admLoad(){if(ADMBUSY||!sbAdmin())return;ADMBUSY=true;ADMERR="";const uid=SBS.uid;
 // Asks the database for the overview.
 sbReq("/rest/v1/rpc/admin_overview",{method:"POST",body:{}}).then(r=>{ADMBUSY=false;if(!sbIn()||SBS.uid!==uid)return;
  // Got the numbers: keeps them in memory, with the time.
  if(r.ok&&r.j&&typeof r.j==="object"&&!Array.isArray(r.j)){ADM=r.j;ADMAT=Date.now()}
  // 403: the database says this person is not an admin. Forgets that and hides the Admin page.
  else if(r.status===403||(r.j&&r.j.code==="42501")){SBS.adm=false;sbSave();ADM=null}
  // 404: the Admin SQL has not been run. Remembers that so the page stops asking.
  else if(r.status===404||(r.j&&r.j.code==="PGRST202")){ADMNO=true;SBS.adm=false;sbSave();ADM=null}
  // Anything else: shows a short error (no internet, or a general one).
  else ADMERR=r.net?sbNet:"Couldn’t load the numbers. Please try again.";
  // Redraws the page with whatever happened.
  render()})}
// sbSync(): reads the account again (profile, saved items and the admin check) and redraws if anything changed, but
// not in the middle of the quiz.
async function sbSync(){if(!sbIn())return;const snap=()=>JSON.stringify([S.ans,S.done,S.saved,S.mine,S.me,me(),sbAdmin(),sbNeedPull]),b=snap();await Promise.all([sbPull(),sbAdminCheck()]);if(snap()!==b&&S.stage!=="quiz")render()}
// sbEvents(): sets up retries. When the browser comes back online or the tab becomes visible again, it loads the
// account data if that never worked, or sends the changes that are waiting.
function sbEvents(){const again=()=>{if(!sbIn())return;if(sbNeedPull)sbSync();else if(sbPending())sbQueue()};addEventListener("online",again);document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")again()})}
/* leaving this account on this device: send anything not yet online first, and ask if that fails */
async function sbLeave(q){if(sbPending()){await sbFlush();if(sbPending()&&!confirm("Some changes haven’t reached your account yet. Continue anyway?"))return false}return q?confirm(q):true}
// authMsg(m): shows an error on the log in, sign up, email code and other forms. It changes the red line in place, so
// what was typed stays. If there is no red line it redraws.
function authMsg(m){S.err=m;const e=document.querySelector("#full .err");if(e){e.textContent=m;e.scrollIntoView({block:"nearest"})}else render()}
// authBusy(on): while a request runs, the form's button says "Please wait…" and more clicks are ignored. Gives true
// if it was already busy.
function authBusy(on){if(on&&AUTHBUSY)return true;AUTHBUSY=on;const b=document.querySelector('#full [data-act="dologin"],#full [data-act="dosignup"],#full [data-act="dochpw"],#full [data-act="dowl"],#full [data-act="doverify"]');if(b){if(on){b.dataset.t=b.textContent;b.textContent="Please wait…"}else if(b.dataset.t)b.textContent=b.dataset.t;b.disabled=on}return false}
// formSnap(): the name and email as typed so far, so they can be carried to another form.
const formSnap=()=>({name:val("a_name"),email:val("a_email")});
// privNote(): the honest sentence about where quiz answers are kept (your account, this device, or this device until
// you sign up).
const privNote=()=>sbIn()?"Your answers are saved to your account so they follow you to your other devices. They’re used to rank opportunities for you.":SBON?"Your answers stay on this device. If you create an account, they’re saved to it.":"Your answers stay on this device. They’re used to rank opportunities here, not sent to a server.";
// go(t,x): switches to tab t (resets the category filter and the list length when the tab changes), clears any error,
// applies the extra changes x, redraws and scrolls to the top.
const go=(t,x)=>{if(t!==S.tab){S.cat="All";S.lim=8}S.tab=t;S.err="";Object.assign(S,x||{});render();scrollTo(0,0)};
// draws one quiz question: its label, then the right kind of answer box
function field(q){
 // v: the saved answer for this question. ph: the grey example text for this person. are: "are they" or "are you". h:
 // the HTML being built.
 const v=S.ans[q.id],ph=esc(qt(q,"ph","pp")),are=who()?"are they":"are you";let h="";
 // A drop-down list with the saved choice selected.
 if(q.k==="select")h=`<select class="f" data-id="${q.id}"><option value="">Choose…</option>${q.o.map(o=>`<option${v===o?" selected":""}>${esc(o)}</option>`).join("")}</select>`;
 // A box for the ZIP code (numbers only, five digits) with a short help sentence under it.
 else if(q.k==="zip")h=`<input type="text" class="f" inputmode="numeric" autocomplete="postal-code" maxlength="5" data-id="${q.id}" placeholder="${ph}" value="${esc(v)}"><small class="meta">${esc(sub(q.help))}</small>`;
 // A text area for a sentence or two.
 else if(q.k==="text")h=`<textarea rows="3" data-id="${q.id}" placeholder="${ph}">${esc(v)}</textarea>`;
 // One-choice buttons (radio buttons), one per choice, using the parent or teacher wording when there is one.
 else if(q.k==="radio")h=q.o.map((o,i)=>`<label class="opt"><input type="radio" name="${q.id}" data-id="${q.id}" value="${esc(o)}"${v===o?" checked":""}>${esc(who()&&q.po?q.po[i]:o)}</label>`).join("");
 // The skills table: for each skill a row of 1 to 5 buttons for "how good" and another for "how interested" (seg
 // builds one row).
 else if(q.k==="skills"){const s=S.ans.skills||{},seg=(k,w)=>`<div><small class="sl">${w==="g"?`How good ${are}?`:"How interested?"}</small><div class="seg">${[1,2,3,4,5].map(n=>`<button type="button" class="${(s[k]||{})[w]===n?"on":""}" data-act="sk" data-k="${esc(k)}" data-w="${w}" data-n="${n}">${n}</button>`).join("")}</div></div>`;
 // The header row of the table, then one row per skill, with the most related skills first.
 h=`<div class="sk skh mut"><span></span><b>How good ${are}? 1 = not good, 5 = strong</b><b>How interested? 1 = not interested, 5 = very</b></div>`+relSkills().map(k=>`<div class="sk"><b>${esc(k)}</b>${seg(k,"g")}${seg(k,"i")}</div>`).join("")}
 // Anything else is tick boxes (checkboxes), one per choice, ticked when already chosen.
 else h=q.o.map(o=>`<label class="opt"><input type="checkbox" data-id="${q.id}" value="${esc(o)}"${(v||[]).includes(o)?" checked":""}>${esc(o)}</label>`).join("");
 // The whole question: its label (with a star if it is required) followed by the answer box.
 return`<div class="q"><label class="ql">${qt(q,"t","p")}${q.opt?"":" *"}</label>${h}</div>`}
// fitList(o): the "good fit" traits of an opportunity as a sentence, leaving out traits that only repeat words from
// its name (unless fewer than two would be left).
const fitList=o=>{const n=terms(o.name),t=o.good_fit_if_you_are.filter(x=>![...terms(x).keys()].some(k=>n.has(k)));return(t.length>=2?t:o.good_fit_if_you_are).join(", ")};
// topics(): the topic chips above the lists. Adds up the match levels of each tag among the top 15 matches (skipping
// very general tags) and keeps the best five.
function topics(){const c=new Map(),skip=new Set(["service hours","volunteering","competition","teens","summer program","summer","internship","students","clubs","community","events","leadership","mentoring"]);for(const r of pool().slice(0,15))for(const t of r.o.tags){if(skip.has(t.toLowerCase()))continue;c.set(t,(c.get(t)||0)+r.score)}return[...c].sort((a,b)=>b[1]-a[1]).slice(0,5).map(x=>x[0])}
// searchView(): the Search results page. Takes the ranked opportunities the person is not already doing and gives
// each points for the typed words, plus extra when the whole phrase is in the name, tags, description or category.
// Drops those with no points.
function searchView(){const qr=terms(S.q),ql=S.q.toLowerCase();let rows=pool().filter(r=>!S.mine[r.o.id]).map(r=>{let s=0;for(const [st] of qr){const w=r.o.idx.get(st);if(w)s+=w*idf(st)}if((r.o.name+" "+r.o.tags.join(" ")).toLowerCase().includes(ql))s+=4;if((r.o.description+" "+r.o.category).toLowerCase().includes(ql))s+=2;return{...r,s}}).filter(r=>r.s>0).sort((a,b)=>b.s-a.s||b.score-a.score);
 // by(sc): the rows that belong to one tab. Then the page: a heading, a count and one section per tab with its cards.
 const by=sc=>rows.filter(r=>r.o.scope===sc);return`<h1>Results for “${esc(S.q)}”</h1><p class="mut">${rows.length} opportunities across all three tabs: ${by("School").length} School, ${by("Community").length} Community, ${by("Explore").length} Explore.</p>${["School","Community","Explore"].map(sc=>by(sc).length?`<h2>${sc} (${by(sc).length})</h2>${cards(by(sc))}`:"").join("")||`<div class="empty">No matches. Try a broader word like “science” or “art”.</div>`}`}
// authView(m): the log in or sign up form ("Login" or "Signup"). Sign up adds the name box, the four account type
// cards and the organization box (which only shows for Organizer). What was typed is kept in FORM so switching
// between the forms does not lose it.
function authView(m){const L=m==="Login";return`<section class="box"><h1>${L?"Welcome back":"Create your account"}</h1><p class="mut">${L?"Log in to "+BRAND+".":"Free for students. No payment details needed."}</p>${INFO?`<div class="inf" role="status">${esc(INFO)}</div>`:""}<form id="af" novalidate>${L?"":`<div class="q"><label class="ql" for="a_name">Full name</label><input type="text" id="a_name" autocomplete="name" value="${esc(FORM.name)}"></div>`}<div class="q"><label class="ql" for="a_email">Email</label><input type="email" id="a_email" autocomplete="email" autocapitalize="none" spellcheck="false" value="${esc(FORM.email)}"></div><div class="q"><label class="ql" for="a_pw">Password</label><input type="password" id="a_pw" autocomplete="${L?"current-password":"new-password"}"></div>${L?"":`<div class="q"><label class="ql">Who is this account for?</label>${ROLES.map(([v,l,d],i)=>`<label class="role"><input type="radio" name="a_who" value="${v}"${i?"":" checked"}><span><b>${l}</b><small>${d}</small></span></label>`).join("")}</div><div class="q orgq"><label class="ql" for="a_org">Organization name</label><input type="text" id="a_org" autocomplete="organization"></div>`}<div class="err" role="alert">${esc(S.err)}</div><button class="btn pri big" data-act="${L?"dologin":"dosignup"}" style="width:100%">${L?"Log in":"Create account"}</button></form><p class="mut">${L?`New here? <a href="#" data-act="signup">Create an account</a>`:`Have an account? <a href="#" data-act="login">Log in</a>`}</p><p class="meta mut">${SBON?"Your name, email, quiz answers and saved items are stored in your account. Friends and messages are saved on this device only for now.":"Prototype: accounts, friends and messages are saved on this device until a shared database is connected."}</p></section>`}
// the email-code step. It only shows when the project asks new accounts to confirm their email: the project has emailed a code to S.vmail

const verView=()=>`<section class="box"><h1>Check your email</h1><p class="mut">We sent a code to <b>${esc(S.vmail)}</b>. Type it below to finish creating your account.</p>${INFO?`<div class="inf" role="status">${esc(INFO)}</div>`:""}<form id="af" novalidate><div class="q"><label class="ql" for="v_code">Code from the email</label><input type="text" id="v_code" class="vc" inputmode="numeric" autocomplete="one-time-code" maxlength="12" autocapitalize="none" spellcheck="false"></div><div class="err" role="alert">${esc(S.err)}</div><button class="btn pri big" data-act="doverify" style="width:100%">Confirm email</button></form><p class="mut">Nothing yet? Check your spam folder, or <a href="#" data-act="resend">send a new code</a>.</p><p class="mut">Wrong address? <a href="#" data-act="vchange">Use a different email</a></p></section>`;
// PWOK: true right after the password was changed, so the screen shows "Password changed" instead of the form.
let PWOK=false;

/* the school waitlist: the one thing a guest can send. It calls a database function that only adds a row, with the publishable key and no login. */
// wlView(): the waitlist screen. Once WLOK holds the email it shows the thank-you panel, otherwise the form. The
// hidden "Leave this empty" box (class hp) is a trap for robots: people never see it, so if it gets filled in the

const wlView=()=>WLOK?`<section class="box"><h1>You’re on the list.</h1><p class="mut">Thanks. We’ll email <b>${esc(WLOK)}</b> when ${BRAND} is ready for schools and organizations.</p><button class="btn pri big" data-act="wlback" style="width:100%">Done</button></section>`:`<section class="box"><h1>Join the school waitlist</h1><p class="mut">For schools, clubs and organizations that want to list their opportunities on ${BRAND}. We’ll email you when it’s ready. It’s free to join.</p><form id="af" novalidate><div class="q"><label class="ql" for="w_org">School or organization</label><input type="text" id="w_org" autocomplete="organization" maxlength="120" value="${esc(WLF.org)}"></div><div class="q"><label class="ql" for="w_email">Your email</label><input type="email" id="w_email" autocomplete="email" autocapitalize="none" spellcheck="false" maxlength="254" value="${esc(WLF.email)}"></div><div class="q"><label class="ql" for="w_note">Anything you want us to know? <span class="mut">(optional)</span></label><textarea id="w_note" rows="3" maxlength="500">${esc(WLF.note)}</textarea></div><div class="hp" aria-hidden="true"><label>Leave this empty<input type="text" id="w_hp" tabindex="-1" autocomplete="off"></label></div><div class="err" role="alert">${esc(S.err)}</div><button class="btn pri big" data-act="dowl" style="width:100%">Join the waitlist</button></form><p class="meta">We save your answers so we can reach you about ${BRAND} for schools.</p></section><button class="lk" data-act="wlback">‹ Back</button>`;
// wlErr(r): the sentence for a waitlist problem: no internet, "not open yet" if the SQL has not been run, or the

const wlErr=r=>r.net||!r.status?sbNet:r.status===404||(r.j&&r.j.code==="PGRST202")?"The waitlist isn’t open yet. Please try again soon.":sbErr(r);

// vidSrc(): works out what kind of link VIDEO is: a YouTube, Vimeo or Synthesia player address (f), a plain video
// file (m), any other link (l), or nothing.
function vidSrc(){const v=VIDEO.trim(),yt=v.match(/(?:youtu\.be\/|[?&]v=|youtube\.com\/(?:embed|shorts)\/)([\w-]{11})/),vm=v.match(/vimeo\.com\/(?:video\/)?(\d+)/),sy=v.match(/synthesia\.io\/embeds\/videos\/([\w-]+)/i)||v.match(/share\.synthesia\.io\/([0-9a-f]{8}(?:-[0-9a-f]{4}){3}-[0-9a-f]{12})/i);
  // YouTube: the privacy-friendly player address, set to start playing.
  if(yt)return{f:"https://www.youtube-nocookie.com/embed/"+yt[1]+"?autoplay=1&rel=0&playsinline=1"};
  // Vimeo: its player address.
  if(vm)return{f:"https://player.vimeo.com/video/"+vm[1]+"?autoplay=1"};
  // Synthesia: its embed player address (a share link and its embed link use the same video id).
  if(sy)return{f:"https://share.synthesia.io/embeds/videos/"+sy[1]+"?autoplay=1"};
  // A video file (or a file path in this folder): play it with a video tag.
  if(v&&(/\.(mp4|webm|mov|m4v)(\?|#|$)/i.test(v)||!/^https?:/i.test(v)))return{m:v};

 // Escape ends the tour; turning the phone or resizing the window moves the card so it never covers what it points at
 document.addEventListener("keydown",e=>{if(e.key==="Escape"&&TOUR!==null)tourEnd()});
 addEventListener("resize",()=>{if(TOUR!==null)tourDraw()});
 // The search box in the top bar: typing opens the Search tab (clearing it returns to Home) and redraws. It is filled
 // with any saved search.
 $("q").addEventListener("input",e=>{S.q=e.target.value;if(S.q.trim())S.tab="Search";else if(S.tab==="Search")S.tab="Home";render()});$("q").value=S.q;
 // In online mode: sets up the retries and loads the account's data. This ends init().
 if(SBON){sbEvents();sbSync()}}
// Starts everything (unless the code is being run without a page, for example by a test tool).
if(typeof document!=="undefined")init();
